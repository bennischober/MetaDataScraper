<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Canon Admin</title><style>
* { box-sizing: border-box; margin: 0; }
body { width: 1440px; height: 900px; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }

</style></head><body>

<div style="width:1440px;height:900px;background:#f8fafc;color:#111827;display:flex;font-size:13px;">
  <div style="width:210px;background:#ffffff;border-right:1px solid #e5e7eb;padding:18px;">
    <div style="font-weight:700;font-size:15px;margin-bottom:24px;">MetaDataScraper</div>
    <div style="padding:8px 12px;background:#eff6ff;color:#2563eb;border-radius:6px;margin-bottom:4px;">Dashboard</div>
    <div style="padding:8px 12px;color:#6b7280;">Library</div>
    <div style="padding:8px 12px;color:#6b7280;">History</div>
    <div style="padding:8px 12px;color:#6b7280;">Settings</div>
  </div>
  <div style="flex:1;padding:28px;">
    <h1 style="font-size:20px;margin-bottom:20px;">Dashboard</h1>
    <div style="display:flex;gap:16px;margin-bottom:24px;">
      <div style="flex:1;background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:18px;"><div style="color:#6b7280;font-size:12px;">Running</div><div style="font-size:22px;font-weight:700;">Django Unchained</div></div>
      <div style="flex:1;background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:18px;"><div style="color:#6b7280;font-size:12px;">Queue</div><div style="font-size:22px;font-weight:700;">1</div></div>
      <div style="flex:1;background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:18px;"><div style="color:#6b7280;font-size:12px;">Saved</div><div style="font-size:22px;font-weight:700;color:#059669;">3.57 GB</div></div>
    </div>
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:10px;overflow:hidden;">
      <table style="width:100%;border-collapse:collapse;font-size:12px;">
        <tr style="background:#f9fafb;text-align:left;"><th style="padding:10px 14px;">Movie</th><th style="padding:10px 14px;">Resolution</th><th style="padding:10px 14px;">Size</th><th style="padding:10px 14px;">Status</th><th style="padding:10px 14px;">VMAF</th></tr>
        <tr><td style="padding:9px 14px;border-top:1px solid #f3f4f6;">Django Unchained</td><td style="padding:9px 14px;border-top:1px solid #f3f4f6;">642x426</td><td style="padding:9px 14px;border-top:1px solid #f3f4f6;">5.55 GB</td><td style="padding:9px 14px;border-top:1px solid #f3f4f6;"><span style="background:#dcfce7;color:#059669;padding:2px 8px;border-radius:99px;font-size:11px;">encoded</span></td><td style="padding:9px 14px;border-top:1px solid #f3f4f6;">95.25</td></tr>
        <tr><td style="padding:9px 14px;border-top:1px solid #f3f4f6;">Bloodshot (Alt)</td><td style="padding:9px 14px;border-top:1px solid #f3f4f6;">1920x800</td><td style="padding:9px 14px;border-top:1px solid #f3f4f6;">0.42 GB</td><td style="padding:9px 14px;border-top:1px solid #f3f4f6;"><span style="background:#fef3c7;color:#b45309;padding:2px 8px;border-radius:99px;font-size:11px;">skipped</span></td><td style="padding:9px 14px;border-top:1px solid #f3f4f6;">91.97</td></tr>
      </table>
    </div>
  </div>
</div>
</body></html>
