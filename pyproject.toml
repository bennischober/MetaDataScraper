[project]
name = "metadata-scrapper"
version = "0.2.0"
description = "A short python script to get video meta data."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Benjamin Schober" },
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.143.0",
    "loguru>=0.7.3",
    "rich>=15.0.0",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
metadata-scrapper = "metadata_scrapper.__main__:app"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "playwright>=1.64.0",
    "pytest>=8.4",
    "pytest-cov>=7.1.0",
    "requests>=2.34.2",
    "ruff>=0.14",
]

[project.urls]
Repository = "https://github.com/bennischober/MetaDataScraper"
Issues = "https://github.com/bennischober/MetaDataScraper/issues"
Changelog = "https://github.com/bennischober/MetaDataScraper/releases"

[tool.uv]
# Supply-chain hardening: skip packages published in the last 7 days so freshly
# poisoned releases don't enter resolution before they are detected and yanked.
exclude-newer = "7 days"
# security fixes are exempt from the cooldown (the audit gate fails otherwise,
# and a known-fixed vulnerability is the exact case the cooldown may delay)
exclude-newer-package = { certifi = false }

[tool.uv.audit]
# Refuse to sync packages with a published malware advisory (OSV MAL database).
malware-check = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metadata_scrapper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=metadata_scrapper --cov-report=term-missing"

[tool.mypy]
python_version = "3.10"
files = ["src"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF",
]
ignore = [
    "E501", # line length handled by formatter
    "E741", # ambiguous variable names (dict, l, ...)
]

[tool.ruff.lint.per-file-ignores]
# typer.Argument/typer.Option in defaults is the framework's intended usage
"src/metadata_scrapper/__main__.py" = ["B008"]
# FastAPI Depends() in defaults is the framework's intended usage
"src/metadata_scrapper/app.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["metadata_scrapper"]

[tool.coverage.run]
branch = true
source = ["metadata_scrapper"]

[tool.coverage.report]
show_missing = true
