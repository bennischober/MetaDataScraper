name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install dependencies
        run: uv sync --dev

      - name: Run checks (ruff, mypy, tests)
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run mypy
          uv run pytest -q --no-cov

      - name: Build distributions
        run: uv build

      - name: Extract release notes from README
        run: |
          # use the git tag annotation as release notes, fallback to generic text
          {
            echo "## MetaDataScraper ${{ github.ref_name }}"
            echo ""
            echo "See [README](https://github.com/${{ github.repository }}#readme) for install and usage instructions."
          } > RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          files: dist/*

      - name: Upload artifacts (on failure for debugging)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
